# Perfiles de compilacion de arduino-cli: fijan el core y las librerias con
# los que se ha probado el firmware, para que un 'core upgrade' o una version
# nueva de LovyanGFX no cambien lo que se compila sin querer. Las versiones se
# suben a mano y a proposito, despues de compilar y probar en la placa.
#
#   tools/arduino-cli compile firmware/pauta               -> v1 (por defecto)
#   tools/arduino-cli compile --profile v2 firmware/pauta  -> v2
#
# La V2.0 necesita ademas cambiar los pines del LCD en board.h.

profiles:
  # V1.0: modulo N16R2, PSRAM de 2 MB en modo QSPI. Consola por el USB nativo.
  v1:
    fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc,PSRAM=enabled,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - LovyanGFX (1.2.33)
      - ArduinoJson (7.4.3)

  # V2.0: modulo N16R8, PSRAM de 8 MB en modo octal (OPI).
  v2:
    fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc,PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - LovyanGFX (1.2.33)
      - ArduinoJson (7.4.3)

default_profile: v1
